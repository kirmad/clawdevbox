name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# Cancel concurrent runs for the same tag (unlikely, but safe)
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build & test before publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            mcp-server/package-lock.json
            mcp-server/web/package-lock.json

      - name: Install mcp-server deps
        working-directory: mcp-server
        run: npm ci

      - name: Install web SPA deps
        working-directory: mcp-server/web
        run: npm ci || npm install

      - name: Typecheck
        working-directory: mcp-server
        run: npm run typecheck

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Fast test subset
        working-directory: mcp-server
        run: |
          node --import tsx --test --test-force-exit \
            tests/smoke.test.mjs \
            tests/workspace.test.mjs \
            tests/validators.test.mjs \
            tests/db-migrations.test.mjs \
            tests/db-stores.test.mjs \
            tests/inbox-persistence.test.mjs \
            tests/scheduler.test.mjs \
            tests/dispatcher.test.mjs \
            tests/cron-api.test.mjs \
            tests/callback-api.test.mjs \
            tests/manifest-load.test.mjs \
            tests/marketplace-load.test.mjs

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    # Trusted Publishing (OIDC) requires id-token: write
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: |
            mcp-server/package-lock.json
            mcp-server/web/package-lock.json

      - name: Install mcp-server deps
        working-directory: mcp-server
        run: npm ci

      - name: Install web SPA deps
        working-directory: mcp-server/web
        run: npm ci || npm install

      - name: Verify package version matches tag
        working-directory: mcp-server
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION"
          echo "tag:          $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish (prepublishOnly runs build)
        working-directory: mcp-server
        run: npm publish --provenance --access public
        # Trusted Publishing via OIDC (configured on npmjs.com for this package).
        # No NPM_TOKEN needed; npm CLI exchanges the GitHub Actions OIDC token
        # for a short-lived publish token automatically.
        # --provenance attaches a signed attestation linking this tarball to
        # this exact commit + workflow run.
