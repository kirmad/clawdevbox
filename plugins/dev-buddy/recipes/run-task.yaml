id: run-task
name: "Autonomous task with planning, verification, artifact, and memory write"
description: >
  Wrap any substantive task in the plan → execute → verify → summarize
  → memorize loop. Use when the user wants a persistent record of the
  work (an investigation, a refactor, a multi-file change). Differs
  from a plain chat conversation in that it always produces a
  markdown artifact, enforces verification between steps, and writes
  durable learnings to memory.md at the end.

inputs:
  task:
    description: "Free-form description of what to do. The agent will plan, ask before mutating, execute step by step, and report."
    type: string
    required: true
  auto_proceed:
    description: "If true, skip the 'Proceed?' gate after the plan. Use only when the user has already confirmed the scope. Default false."
    type: boolean
    required: false
    default: false
  artifact_id:
    description: "Override the artifact id. Default is auto-derived from the task summary."
    type: string
    required: false

prompt: |
  Execute the following task with the dev-buddy autonomous loop. Read
  your `SKILL.md`, `STANDING_ORDERS.md`, `TOOLS.md`, and the workspace
  `memory.md` before starting if you haven't already.

  **Task:** {{task}}

  ## Phase 1 — Plan (visible, terse)

  Emit a numbered plan: 3–7 bullets, each an observable outcome (not a
  tool call). Cite the files / ids you expect to touch.

  After the plan:
  - If `auto_proceed: true`, begin executing immediately.
  - Otherwise, if every step is Tier-1 (per `STANDING_ORDERS.md`):
    begin executing immediately.
  - Otherwise (any step is Tier-2 or Tier-3): end the plan with
    **"Proceed?"** and wait for the user. Don't act on a Tier-2/3 step
    without explicit consent.

  ## Phase 2 — Execute one step at a time

  For each step in the plan:

  1. **Execute.** Run the tool that does the thing.
  2. **Verify.** Read the resulting state. Confirm the change is
     present. Cite the verification tool call.
  3. **Report.** One line: `step N: <verb> <id> ✓ <verified-fact>`.

  If a step fails, follow `STANDING_ORDERS.md` failure handling: up
  to 3 attempts on transient errors; stop and escalate on
  validation/permission/not-found. Never silently fall back to a
  different approach.

  Maintain a running summary in your scratchpad (the Hermes-style
  rolling-summary pattern) — what's been done, what's still
  outstanding, any decisions made on the way. Include it in the
  final artifact.

  ## Phase 3 — Write the summary artifact

  When the plan is fully executed (or stopped due to a Tier-2/3 gate or
  a non-recoverable failure), write a markdown artifact:

  ```
  artifact.add({
    id: '{{artifact_id}}' || 'task-<short-slug-of-task>-<YYYYMMDD>',
    type: 'markdown',
    title: '<one-line task title>',
    files: { 'content.md': '<the markdown summary>' },
    recipe_instance_id: <CLAWDEVBOX_RECIPE_INSTANCE_ID env var if set>,
  })
  ```

  Markdown structure:

  ```
  # <Task title>

  ## Outcome
  <1-2 sentences. What is now true that wasn't before? Or, if the
  task didn't complete: what stopped it?>

  ## Plan
  <numbered list, copy-pasted from Phase 1>

  ## Execution log
  <one bullet per step:
  - **Step N — <step goal>:** <what you did> · verified by `<tool
    call>` → <verification result>>

  ## Files / ids touched
  - <file:line> — <one-line description of the change>
  - <recipe_id>, <artifact_id>, <inbox_id> as relevant

  ## Verification
  <what reads were used to confirm. Re-state the verification
  evidence — don't make the reader trust 'verified ✓' on faith.>

  ## Deferred / open
  <anything that came up during the task but was out of scope.
  Bulleted. Each item with a suggested next step.>

  ## Suggested next
  <one concrete thing the user might do next, with the command or
  tool call ready to paste.>
  ```

  Capture the returned `view_url`.

  ## Phase 4 — Memorize

  Append to `<workspace>/.clawdevbox/memory.md` under the most
  appropriate heading **only if you learned something durable** about
  the project that the next session would benefit from. Examples
  worth recording:
  - A non-obvious build/test/lint command.
  - A service that's behind a flag or in a non-default region.
  - A repeated failure pattern and the workaround.
  - A new decision the user made in this conversation.

  Skip the memorize phase if there was no durable learning. Don't
  pad memory with low-signal entries — every line should be the kind
  of thing the next session would be happier knowing than not.

  Append style:
  - Under `## Decisions log`: `- YYYY-MM-DD: <one-line decision>`
  - Under `## Architecture & gotchas`: `- <one-line gotcha>`
  - Under `## Ongoing threads`: `- <thread name> — last status as of
    YYYY-MM-DD: <one line>`

  ## Phase 5 — Wrap up

  Report inline:
  - `view_url`: <the artifact URL>
  - `memory.md updated:` <yes|no — and which heading if yes>
  - `next:` <the one suggested next step from the artifact>

  Then `recipe.done({ status: 'success' | 'failure' | 'partial',
  message: '<short outcome>' })`.

  ## Boundaries

  - If the task is small enough to do inline in chat without needing a
    persistent artifact, **decline this recipe** and tell the user to
    just describe the task directly. The recipe is for substantive
    work, not trivia.
  - If the task is genuinely too large for one run (more than ~15
    steps, or touches more than ~10 files), stop after the plan and
    propose breaking it into multiple `run-task` invocations.
